<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Cocos Creator | leiting-kupao</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <h1 class="header">leiting-kupao</h1>

    <div id="GameDiv" cc_exact_fit_screen="false">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
      </div>
    </div>
    <p class="footer">
      Created with <a href="https://www.cocos.com/products" title="Cocos Creator">Cocos Creator</a>
    </p>
    <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

<script>
  // 本地/桌面测试适配：游戏容器按 750:1624 竖屏比例等比缩放并居中，
  // 避免默认 1280x960 横屏画布下竖屏 UI 上下被裁、按钮点不到。
  // BG4 视频垫底：?bg=video 时在游戏画布下垫 DOM 视频（需透明画布宏，见 scripts/bg-eval/）。
  (function () {
    var DESIGN_W = 750;
    var DESIGN_H = 1624;
    var BG_VIDEO_SRC = './bg-test.webm';
    var bgVideo = null;
    var bgVideoFailed = false;

    function isBgVideoMode() {
      // 与游戏侧 MainMenuBackground.resolveBackgroundMode 同口径：精确取 bg 参数
      try {
        return new URLSearchParams(location.search).get('bg') === 'video';
      } catch (err) {
        return false;
      }
    }

    function ensureBgVideo() {
      if (bgVideo) return bgVideo;
      var el = document.getElementById('bgVideo');
      if (!el) {
        el = document.createElement('video');
        el.id = 'bgVideo';
        el.setAttribute('src', BG_VIDEO_SRC);
        el.setAttribute('muted', '');
        el.setAttribute('loop', '');
        el.setAttribute('playsinline', '');
        el.setAttribute('autoplay', '');
        el.muted = true;
        el.loop = true;
        el.autoplay = true;
        document.body.insertBefore(el, document.body.firstChild);
      }
      // 文件缺失/解码失败静默降级：隐藏视频，页面照常运行。
      el.addEventListener('error', function () {
        bgVideoFailed = true;
        el.style.display = 'none';
      });
      var played = el.play();
      if (played && typeof played.catch === 'function') {
        played.catch(function () { /* 自动播放受限/加载失败：静默降级 */ });
      }
      bgVideo = el;
      return bgVideo;
    }

    function fitBgVideo(gd) {
      if (!isBgVideoMode() || bgVideoFailed) return;
      var el = ensureBgVideo();
      var rect = gd.getBoundingClientRect();
      el.style.left = (rect.left + (window.scrollX || 0)) + 'px';
      el.style.top = (rect.top + (window.scrollY || 0)) + 'px';
      el.style.width = Math.round(rect.width) + 'px';
      el.style.height = Math.round(rect.height) + 'px';
      el.style.display = 'block';
    }

    function fit() {
      var gd = document.getElementById('GameDiv');
      if (!gd) return;
      var s = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
      gd.style.width = Math.floor(DESIGN_W * s) + 'px';
      gd.style.height = Math.floor(DESIGN_H * s) + 'px';
      fitBgVideo(gd);
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
  </body>
</html>
