# Include inside the existing official vhost. Remove previous exact entry/API locations first.
# Do not preempt debug requests before Node: Node must revoke the presented eligibility session.
location = /thunder-run/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
location = /thunder-run/index.html {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
location ^~ /thunder-run/api/ {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
