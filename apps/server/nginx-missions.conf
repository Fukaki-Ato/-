# Include inside the existing official vhost. Mission API proxies under the same origin root
# (client missionApi.ts posts to /api/missions — same-origin, no base prefix; see docs/missions-backend.md).
location ^~ /api/missions {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8768;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
