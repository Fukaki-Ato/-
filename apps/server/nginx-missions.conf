# Include inside the existing game vhost: one process, session and wallet.
# Client URLs are rooted at /api/missions and /api/achievements (no deployment prefix).
location ~ ^/api/(missions|achievements)(/|$) {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8768;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 25s;
}
